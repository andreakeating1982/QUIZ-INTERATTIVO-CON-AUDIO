  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Auto-resize iframe: comunica l'altezza al parent per l'embed nel blog -->
    <script>
      (function() {
        if (window === window.parent) return;
        var sendHeight = function() {
          var h = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight,
            document.body.offsetHeight,
            document.documentElement.offsetHeight,
            document.getElementById('root') && document.getElementById('root').scrollHeight || 0
          );
          window.parent.postMessage({ type: "labvisivo:height", height: h }, "*");
        };
        window.addEventListener("load", function() { setTimeout(sendHeight, 150); });
        window.addEventListener("resize", sendHeight);
        if (window.MutationObserver) {
          var obs = new MutationObserver(sendHeight);
          obs.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
        }
        setTimeout(sendHeight, 500);
        setTimeout(sendHeight, 1500);
      })();
    </script>
  </body>

</html>
